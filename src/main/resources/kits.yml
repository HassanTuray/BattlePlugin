# Kits: which abilities a player starts with.
#
# When someone joins, this is how their loadout is chosen (first match wins):
#   1. They already have a saved loadout (plugins/BattlePlugin/playerdata/<uuid>.yml)  -> that is used. This file is not read.
#   2. Their UUID is listed under "players"
#   3. Their username is listed under "players" (not case-sensitive)
#   4. The "default" kit, if there is one
#
# A new friend only needs a line under "players" with their username. Nobody needs their UUID in advance.
# Use "/kits reload" after editing, and "/kits apply <player>" to give an online player their kit again
# (a saved loadout wins over this file, so apply is how a change here reaches someone who has already played).
#
# Ability names are the ones /load accepts (brick, lazer, landmine ...). Each ability goes under its own item:
# attack, mobility, buff, elemental, shikigami or domain (the amethyst shard: domains and maximum techniques). A mistake in this file is reported in the console and skipped; it never stops joining.

# Kit for anyone not listed under "players". Use "none" to give them nothing.
default: starter

kits:
  starter:
    attack: [brick]
    mobility: [leap]
    buff: [adrenaline]

  damon:
    attack: [brick, homebrew, lazer, landmine]
    mobility: [leap, disengage]
    buff: [adrenaline, switchonalazer]

  ali:
    attack: [brick, pharahrocket, laser, bigbang]
    mobility: [leap, teleport]
    buff: [adrenaline, cheesesandwichandtangerines]

  muhammad:
    attack: [brick, pipebomb, anthraxpackage, meltdownofwaves]
    mobility: [leap, shortcut]
    buff: [adrenaline, revolutionaryspirit]

  hassan:
    attack: [brick, malware, jogabonito]
    mobility: [leap, flyingraijin]     # flyingraijin = the Raijin mark arrow + Use Raijin
    buff: [adrenaline, shilajit]
    domain: [explosivegravitybomb]     # a maximum technique: needs 50 chaos

  nathan:
    attack: [brick, orbthrow, threehits, grandslam]
    mobility: [leap, strongleap]
    buff: [adrenaline, theascended]

# Who gets which kit. The key is a username or a UUID.
