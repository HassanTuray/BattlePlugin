# BattlePlugin settings.
# Changes are picked up by "/kits reload" (or a restart). Health and food apply the next time a player joins or respawns.

player:
  # Max health every player gets (20 = ten hearts). Allowed: 2 to 1024.
  base-health: 40
  # Food level players are kept at, because hunger is disabled. Allowed: 0 to 20.
  food-level: 16

# The resource pack with the shikigami model textures (BetterModel). Players are sent it when they join.
# url must be a direct download of the zip. The plugin downloads it itself to work out its hash, so after the zip
# at that link changes, "/kits reload" is all that is needed. Leave url empty to send no pack.
# To update it: copy plugins/BetterModel/build.zip to resourcepack/BetterModel.zip in the project and push it.
resource-pack:
  url: "https://raw.githubusercontent.com/HassanTuray/BattlePlugin/main/resourcepack/BetterModel.zip"
  # true = players must accept the pack to stay on the server
  required: true
  prompt: "Textures for the shikigami models"
  # more packs, sent alongside the first (this one recolours the experience bar red for chaos)
  extra-urls:
    - "https://raw.githubusercontent.com/HassanTuray/BattlePlugin/main/resourcepack/ChaosBar.zip"
    # the Seattle Mist fog: a shader that turns the game's fog into white mist while the domain asks for it
    - "https://raw.githubusercontent.com/HassanTuray/BattlePlugin/main/resourcepack/MistFog.zip"

# Chaos: the energy bar on the experience bar. Gained by dealing damage and kills, lost on death.
# Later, domain expansions will need a full bar. Above "full" the bar stays full but the number keeps counting.
chaos:
  full: 100
  # chaos per heart of damage dealt (1 heart = 2 health)
  per-heart: 1
  kill-gain: 10
  death-loss: 15
  # false = only damage to players counts, so hitting mobs cannot farm chaos (true for testing)
  count-non-player-damage: true
